  <link rel="icon" type="image/png" href="/static/favicon.png" />

  <script>
    // Пред-покраска темы до первого кадра, чтобы не мигало
    (function () {
      try {
        const t = localStorage.getItem("agent_theme");
        if (t) document.documentElement.dataset.theme = t;
        else if (window.matchMedia("(prefers-color-scheme: light)").matches) document.documentElement.dataset.theme = "light";
      } catch (e) {}
    })();
  </script>
  <script src="/static/i18n.js?v=71"></script>
</head>

  <div class="app" id="app" data-rail="expanded">
    <aside class="rail" id="rail">
      <div class="rail-head" data-tauri-drag-region>
        <div class="brand grow" data-tauri-drag-region><span class="brand-mark"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 0.5 C13 8.2 15.8 11 23.5 12 C15.8 13 13 15.8 12 23.5 C11 15.8 8.2 13 0.5 12 C8.2 11 11 8.2 12 0.5 Z"/></svg></span><span>Altair</span></div>
        <button class="btn-icon small" id="rail-collapse" data-i18n-tip="nav.collapse" data-tip="Collapse"><svg class="icon icon-sm"><use href="#i-panel"/></svg></button>
      </div>
      <button class="btn rail-new" id="btn-new"><svg class="icon icon-sm"><use href="#i-plus"/></svg> <span data-i18n="app.newChat">New chat</span></button>
      <div class="rail-search"><svg class="icon icon-sm"><use href="#i-search"/></svg><input class="field" id="session-search" data-i18n-ph="app.searchChats" placeholder="Search chats" /></div>
      <div class="rail-sessions" id="sessions"></div>
      <div class="rail-foot">
        <button class="btn-icon" id="btn-memory" data-i18n-tip="nav.memory" data-tip="Memory"><svg class="icon icon-sm"><use href="#i-brain"/></svg></button>
        <button class="btn-icon" id="btn-commands" data-i18n-tip="nav.commands" data-tip="Commands"><svg class="icon icon-sm"><use href="#i-slash"/></svg></button>
        <button class="btn-icon" id="btn-secrets" data-i18n-tip="nav.secrets" data-tip="Secrets"><svg class="icon icon-sm"><use href="#i-key"/></svg></button>
        <button class="btn-icon" id="btn-trash" data-i18n-tip="nav.trash" data-tip="Recently deleted"><svg class="icon icon-sm"><use href="#i-undo"/></svg></button>
        <button class="btn-icon" id="btn-settings" data-i18n-tip="nav.settings" data-tip="Settings"><svg class="icon icon-sm"><use href="#i-settings"/></svg></button>
        <span class="grow"></span>
        <button class="btn-icon" id="btn-update" data-i18n-tip="nav.updates" data-tip="Updates"><svg class="icon icon-sm"><use href="#i-download"/></svg></button>
        <button class="btn-icon" id="btn-theme" data-i18n-tip="nav.theme" data-tip="Theme"><svg class="icon icon-sm"><use href="#i-moon"/></svg></button>
      </div>
    </aside>

    <main class="work">
      <header class="topbar" data-tauri-drag-region>
        <button class="btn-icon" id="rail-open" hidden><svg class="icon"><use href="#i-menu"/></svg></button>
        <div class="topbar-title grow" data-tauri-drag-region>
          <span class="chat-title truncate" id="chat-title" data-i18n="app.newChat">New chat</span>
          <span class="ws-tag" id="ws-tag" hidden></span>
        </div>
        <div class="dock-toggles">
          <button class="btn-icon dock-tgl" id="tgl-terminal" data-pane="terminal" data-i18n-tip="top.terminal" data-tip="Terminal"><svg class="icon"><use href="#i-terminal"/></svg></button>
          <button class="btn-icon dock-tgl" id="tgl-diff" data-pane="diff" data-i18n-tip="top.diff" data-tip="Code changes"><svg class="icon"><use href="#i-git"/></svg><span class="tgl-dot" id="diff-dot" hidden></span></button>
          <button class="btn-icon dock-tgl" id="tgl-browser" data-pane="browser" data-i18n-tip="top.browser" data-tip="Agent browser"><svg class="icon"><use href="#i-globe"/></svg></button>
          <button class="btn-icon" id="btn-more" data-i18n-tip="top.more" data-tip="More"><svg class="icon"><use href="#i-dots"/></svg></button>
        </div>
        <div class="winctl" id="winctl" hidden>
          <button class="win-btn" id="win-min" data-i18n-tip="win.min" data-tip="Minimize" aria-label="Minimize">
            <svg viewBox="0 0 10 10" width="10" height="10"><path d="M0 5 h10" stroke="currentColor" stroke-width="1"/></svg>
          </button>
          <button class="win-btn" id="win-max" data-i18n-tip="win.max" data-tip="Maximize" aria-label="Maximize">
            <svg class="win-ico-max" viewBox="0 0 10 10" width="10" height="10"><rect x="0.5" y="0.5" width="9" height="9" fill="none" stroke="currentColor" stroke-width="1"/></svg>
            <svg class="win-ico-restore" viewBox="0 0 10 10" width="10" height="10" hidden><rect x="0.5" y="2.5" width="7" height="7" fill="none" stroke="currentColor" stroke-width="1"/><path d="M2.5 2.5 V0.5 H9.5 V7.5 H7.5" fill="none" stroke="currentColor" stroke-width="1"/></svg>
          </button>
          <button class="win-btn win-close" id="win-close" data-i18n-tip="win.close" data-tip="Close" aria-label="Close">
            <svg viewBox="0 0 10 10" width="10" height="10"><path d="M0 0 L10 10 M10 0 L0 10" stroke="currentColor" stroke-width="1"/></svg>
          </button>
        </div>
      </header>

      <div class="work-body" id="work-body">
        <div class="chat-col" id="chat-col">
          <div class="feed-wrap">
            <div class="feed" id="feed"><div class="feed-inner" id="feed-inner"></div></div>
            <button class="jump-btn" id="jump-latest" hidden><svg class="icon icon-sm"><use href="#i-arrow-down"/></svg> <span data-i18n="feed.jumpLatest">Jump to latest</span></button>
          </div>

          <div class="composer-wrap">
            <div class="composer-inner">
              <div class="suggestions" id="suggestions" hidden></div>
              <div class="composer-context">
                <button class="ctx-chip" id="sel-workspace" data-i18n-tip="composer.workspace" data-tip="Working folder">
                  <svg class="icon icon-sm"><use href="#i-folder"/></svg>
                  <span class="sel-val" id="ws-val">…</span>
                  <svg class="icon icon-sm chev"><use href="#i-chevron-down"/></svg>
                </button>
              </div>
              <form class="composer" id="composer" novalidate>
                <div class="attach-preview" id="attach-preview"></div>
                <textarea id="input" rows="1" data-i18n-ph="composer.placeholder" placeholder="Ask or set a task…"></textarea>
                <div class="cmd-popup" id="cmd-popup" hidden></div>
              </form>
              <div class="composer-bar">
                <button class="mode-btn" id="sel-mode" data-i18n-tip="composer.mode" data-tip="Permission mode">
                  <svg class="icon icon-sm"><use href="#i-shield"/></svg>
                  <span class="sel-val" id="mode-val">…</span>
                  <svg class="icon icon-sm chev"><use href="#i-chevron-down"/></svg>
                </button>
                <button type="button" class="btn-icon small" id="btn-plus" data-i18n-tip="composer.attach" data-tip="Attachments & modes"><svg class="icon icon-sm"><use href="#i-plus"/></svg></button>
                <input type="file" id="file-input" multiple hidden />
                <span class="grow"></span>
                <span class="composer-flags" id="composer-flags"></span>
                <button type="button" class="mode-btn" id="sel-model" data-i18n-tip="composer.model" data-tip="Model"><span class="sel-val" id="model-val">…</span><svg class="icon icon-sm chev"><use href="#i-chevron-down"/></svg></button>
                <svg class="ctx-ring" id="ctx-ring" viewBox="0 0 26 26" data-i18n-tip="composer.context" data-tip="Context"><circle class="track" cx="13" cy="13" r="10"/><circle class="fill" cx="13" cy="13" r="10" transform="rotate(-90 13 13)"/><text class="ctx-pct" id="ctx-pct" x="13" y="13.6" text-anchor="middle" dominant-baseline="middle">0</text></svg>
                <button type="submit" form="composer" class="send-btn" id="send-btn" data-i18n-tip="composer.run" data-tip="Run"><svg class="icon"><use href="#i-send"/></svg></button>
              </div>
            </div>
          </div>
        </div>

        <div class="dock" id="dock" hidden>
          <div class="dock-resize" id="dock-resize" data-i18n-tip="pane.resize" data-tip="Drag to resize"></div>

          <section class="pane" id="pane-terminal" data-pane="terminal" hidden>
            <div class="pane-vresize"></div>
            <header class="pane-head"><span class="pane-title" data-i18n="pane.terminal">Terminal</span><span class="grow"></span><button class="btn-icon small" id="btn-terminal-restart" data-i18n-tip="pane.restart" data-tip="Restart"><svg class="icon icon-sm"><use href="#i-refresh"/></svg></button><button class="pane-act" data-act="max" data-i18n-tip="pane.max" data-tip="Full window"><svg class="icon icon-sm"><use href="#i-maximize"/></svg></button><button class="pane-act" data-act="pop" data-i18n-tip="pane.pop" data-tip="Separate window"><svg class="icon icon-sm"><use href="#i-external"/></svg></button><button class="pane-act" data-act="close" data-i18n-tip="pane.close" data-tip="Close"><svg class="icon icon-sm"><use href="#i-x"/></svg></button></header>
            <div class="pane-body" id="view-terminal" style="display:flex;flex-direction:column;padding:0">
              <div id="terminal-host" style="flex:1;min-height:0"></div>
            </div>
          </section>

          <section class="pane" id="pane-diff" data-pane="diff" hidden>
            <div class="pane-vresize"></div>
            <header class="pane-head"><span class="pane-title" data-i18n="pane.changes">Changes</span><span class="grow"></span><button class="pane-act" data-act="max" data-i18n-tip="pane.max" data-tip="Full window"><svg class="icon icon-sm"><use href="#i-maximize"/></svg></button><button class="pane-act" data-act="pop" data-i18n-tip="pane.pop" data-tip="Separate window"><svg class="icon icon-sm"><use href="#i-external"/></svg></button><button class="pane-act" data-act="close" data-i18n-tip="pane.close" data-tip="Close"><svg class="icon icon-sm"><use href="#i-x"/></svg></button></header>
            <div class="pane-body" id="view-diff"></div>
          </section>

          <section class="pane" id="pane-browser" data-pane="browser" hidden>
            <div class="pane-vresize"></div>
            <header class="pane-head"><span class="pane-title" data-i18n="pane.browser">Browser</span><span class="grow"></span><button class="pane-act" data-act="max" data-i18n-tip="pane.max" data-tip="Full window"><svg class="icon icon-sm"><use href="#i-maximize"/></svg></button><button class="pane-act" data-act="pop" data-i18n-tip="pane.pop" data-tip="Separate window"><svg class="icon icon-sm"><use href="#i-external"/></svg></button><button class="pane-act" data-act="close" data-i18n-tip="pane.close" data-tip="Close"><svg class="icon icon-sm"><use href="#i-x"/></svg></button></header>
            <div class="pane-body browser-body" id="view-browser" style="padding:0">
              <div class="browser-bar">
                <button class="btn-icon small" id="br-back" data-i18n-tip="browser.back" data-tip="Back"><svg class="icon icon-sm"><use href="#i-chevron-right" style="transform:rotate(180deg);transform-origin:center"/></svg></button>
                <button class="btn-icon small" id="br-forward" data-i18n-tip="browser.forward" data-tip="Forward"><svg class="icon icon-sm"><use href="#i-chevron-right"/></svg></button>
                <button class="btn-icon small" id="br-reload" data-i18n-tip="browser.reload" data-tip="Reload"><svg class="icon icon-sm"><use href="#i-refresh"/></svg></button>

              <div class="br-dl-shelf" id="br-dl-shelf" hidden></div>
              <div class="browser-view" id="browser-view"><div class="browser-empty dim" data-i18n="browser.empty">Enter an address — the page opens in the agent browser. Session and tabs are kept.</div></div>
