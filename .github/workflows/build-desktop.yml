name: Build desktop

# The desktop app (backend + Tauri window + the `altair` terminal command) for Windows, Linux
# and macOS. Run by hand, or on a version tag; the packages are uploaded as artifacts for the
# release (signed with pc/release_sign.py afterwards, see the release checklist).
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

concurrency:
  group: build-desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: windows-x64
          - os: ubuntu-22.04
            label: linux-x64
          - os: macos-14
            label: macos-arm64
    defaults:
      run:
        working-directory: pc
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pc/requirements.txt

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: System libraries for the window (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Tests
        # Windows and Linux pass the whole suite; macOS has not been run yet, so it only reports.
        continue-on-error: ${{ runner.os == 'macOS' }}
        shell: bash
        # On the Windows runner the same tests as in ci.yml depend on the machine (an Android SDK
        # is installed there, no pwsh for the pty, slow process start), so they are skipped there.
        run: |
          skip=()
          if [ "$RUNNER_OS" = "Windows" ]; then
            for t in tests/test_android_tools.py::test_android_diagnose_reports_missing_sdk \
                     tests/test_background.py::test_quick_command_finishes \
                     tests/test_background.py::test_watch_background_completion_notifies \
                     tests/test_terminal.py::test_pty_echo_roundtrip \
                     tests/test_terminal.py::test_pty_resize_does_not_crash \
                     tests/test_terminal.py::test_terminal_websocket_roundtrip; do
              skip+=(--deselect "$t")
            done
          fi
          python -m pytest -q -p no:cacheprovider "${skip[@]}"

      - name: Build
        run: python build_app.py --zip

      - name: Package name per system
        shell: bash
        run: |
          version=$(cat ../VERSION)
          mv dist/LocalAIAgent-${version}.zip "dist/Altair-${version}-${{ matrix.label }}.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: Altair-${{ matrix.label }}
          path: pc/dist/Altair-*-${{ matrix.label }}.zip
          if-no-files-found: error
