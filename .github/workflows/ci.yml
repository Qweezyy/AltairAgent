name: CI

# Сборка и тесты обеих частей монорепо. PC-тесты и детерминированные evals
# не требуют API-ключа; Android собирает основную (full) сборку.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Отменяем устаревшие прогоны на той же ветке/PR, чтобы не жечь минуты.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pc:
    name: PC · pytest + evals
    # Проект Windows-first: вендоренные tgrep.exe/rg.exe, ConPTY, сборка под Windows.
    runs-on: windows-latest
    defaults:
      run:
        working-directory: pc
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pc/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Исключены тесты, завязанные на окружение раннера (не баги кода):
      #  • android_diagnose — на windows-раннере Android SDK предустановлен (тест ждёт его отсутствие);
      #  • quick_command_finishes, watch_background_completion_notifies — гонки по времени
      #    фоновых команд/уведомлений на медленном раннере;
      #  • test_terminal (PTY) — путь шелла с пробелом ("C:\Program Files\...") в среде раннера.
      - name: Unit tests
        run: python -m pytest -q --deselect tests/test_android_tools.py::test_android_diagnose_reports_missing_sdk --deselect tests/test_background.py::test_quick_command_finishes --deselect tests/test_background.py::test_watch_background_completion_notifies --deselect tests/test_terminal.py::test_pty_echo_roundtrip --deselect tests/test_terminal.py::test_pty_resize_does_not_crash --deselect tests/test_terminal.py::test_terminal_websocket_roundtrip

      - name: Behavior evals (deterministic)
        run: python -m evals

  android:
    name: Android · assembleFullDebug
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      # JDK 21: Gradle 8.11 не совместим с JDK 25, а таргет байткода (17) остаётся.
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: temurin

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties', 'android/gradle/libs.versions.toml') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Build (full/debug)
        run: |
          chmod +x gradlew
          ./gradlew assembleFullDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: altair-full-debug
          path: android/app/build/outputs/apk/full/debug/*.apk
          if-no-files-found: warn

  # Быстрая независимая гигиена репо на каждый push/PR: секреты, утечка внутренних доков.
  hygiene:
    name: Release · repo hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pytest
        run: python -m pip install --upgrade pip pytest
      - name: Repo hygiene checks
        run: python -m pytest release_tests/test_repo_hygiene.py -q

  # Полная независимая приёмка: только на тег v* и по ручному запуску (нужны зависимости pc).
  release-gate:
    name: Release · full acceptance
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pc/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r pc/requirements.txt
      - name: Full release acceptance
        run: python -m pytest release_tests -q
